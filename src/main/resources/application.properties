spring.application.name=act9-13-composers-v2
# Puerto: si la plataforma (Render, Koyeb...) define la variable PORT se usa esa, si no el 9209
server.port=${PORT:9209}
spring.thymeleaf.cache=false

# Carpeta de los .csv y direccion publica de la aplicacion (se cambian en el perfil docker)
app.data-dir=src/main/resources/data/csv
app.url=http://localhost:9209

# Tamano maximo de los ficheros que se pueden subir
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=256KB

# Envio de emails con Gmail (cuenta con verificacion en dos pasos y contrasena de aplicacion)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_CONTRASENA_DE_APLICACION
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
