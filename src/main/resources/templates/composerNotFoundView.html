<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{fragments/headFragment :: headContent('Compositor no encontrado')}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/menuFragment :: header}"></div>

    <main class="container py-4">
        <div class="alert alert-warning">
            No existe ningún compositor llamado "<strong th:text="${name}">nombre</strong>" en la aplicación.
        </div>
        <a class="btn btn-primary" th:href="@{/searchComposer}">Buscar otro compositor</a>
        <a class="btn btn-outline-secondary" th:href="@{/}">Volver al inicio</a>
    </main>
</body>
</html>
