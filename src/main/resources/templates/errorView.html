<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{fragments/headFragment :: headContent('Error')}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menuFragment :: header}"></div>

    <main class="container py-5 flex-grow-1" style="max-width: 760px;">
        <h2 class="mb-3">Se ha producido un error</h2>
        <!-- Mensaje de la excepcion que ha capturado el controlador -->
        <p class="alert alert-danger" role="alert" th:text="${txtError}">error</p>
        <a class="btn btn-primary" th:href="@{/}">Volver al inicio</a>
        <!-- Enlace al formulario del elemento que se estaba creando -->
        <a class="btn btn-outline-secondary" th:if="${formUrl != null}" th:href="@{${formUrl}}"
           th:text="'Volver al formulario de ' + ${formName}">Volver al formulario</a>
    </main>

    <footer th:replace="~{fragments/menuFragment :: footer}"></footer>
</body>
</html>
