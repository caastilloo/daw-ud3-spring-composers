<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{fragments/headFragment :: headContent('Suscribirse')}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menuFragment :: header}"></div>

    <main class="container py-4 flex-grow-1" style="max-width: 760px;">
        <h2 class="mb-3">Suscribirse a <span th:text="${subscriber.composer}">Compositor</span></h2>
        <p class="text-muted">Te enviaremos un email cada vez que se modifique el perfil de este compositor.</p>
        <form action="#" method="post" th:action="@{/composer/subscribe/submit}" th:object="${subscriber}"
              class="card shadow-sm card-body">
            <input type="hidden" th:field="*{composer}">
            <div class="mb-3" th:classappend="${#fields.hasErrors('username')} ? 'cssError'">
                <label for="username" class="form-label">Nombre de usuario</label>
                <input type="text" id="username" class="form-control" th:field="*{username}">
                <span class="cssError" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</span>
            </div>
            <div class="mb-3" th:classappend="${#fields.hasErrors('email')} ? 'cssError'">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" th:field="*{email}">
                <span class="cssError" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</span>
            </div>
            <div>
                <button type="submit" class="btn btn-success">Suscribirme</button>
                <a class="btn btn-outline-secondary" th:href="@{/composer(name=${subscriber.composer})}">Cancelar</a>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragments/menuFragment :: footer}"></footer>
</body>
</html>
