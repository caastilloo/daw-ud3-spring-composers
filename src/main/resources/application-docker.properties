# Perfil "docker": se activa con SPRING_PROFILES_ACTIVE=docker
# Dentro del contenedor la aplicacion escucha en el 8080 (o en el PORT que diga la plataforma)
server.port=${PORT:8080}
# Los .csv se copian del jar a esta carpeta al arrancar (ver DataDirInitializer)
app.data-dir=data/csv
# Direccion publica, para los enlaces de los emails. En la nube se sobreescribe con la variable APP_URL
app.url=${APP_URL:http://localhost:8080}
